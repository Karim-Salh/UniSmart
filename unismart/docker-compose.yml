services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: unismart, POSTGRES_PASSWORD: unismart, POSTGRES_DB: unismart}
    volumes: [pgdata:/var/lib/postgresql/data, ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql, ./database/pgvector.sql:/docker-entrypoint-initdb.d/02-pgvector.sql]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    image: nginx:alpine
    depends_on: [backend]
    volumes: [./frontend:/usr/share/nginx/html:ro, ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["5173:80"]
volumes: {pgdata: {}}
