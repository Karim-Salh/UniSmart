server {
  listen 80;
  root /usr/share/nginx/html;
  index login.html;
  gzip on; gzip_types text/css application/javascript application/json;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 3m; }
  location /assets/models/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location /assets/ { expires 1h; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self)" always;
}
